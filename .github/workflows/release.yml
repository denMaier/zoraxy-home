name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open with the next version and changelog (it also
  # bumps the version in main.go); merging it creates the tag and a draft
  # release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The plugin store reads .introspect, so the release PR regenerates it
  # from the bumped version in main.go.
  introspect:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          make introspect
          if git diff --quiet .introspect; then exit 0; fi
          git config user.name 'release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git commit -m 'chore: update .introspect' .introspect
          git push

  # Builds the tagged version and publishes the draft once its files are there.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: Tag matches the plugin version
        run: |
          make introspect
          git diff --exit-code .introspect
          want="v$(jq -r '"\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)"
          if [ "$TAG" != "$want" ]; then
            echo "Tag $TAG does not match plugin version $want" >&2
            exit 1
          fi
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - run: make release
      - run: |
          gh release upload "$TAG" dist/release/*
          gh release edit "$TAG" --draft=false --latest
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}

  # A release made only of dependency fixes ships on its own; anything with
  # your own feat/fix changes waits for you to merge the release PR.
  automerge:
    needs: [release-please, introspect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
      - run: |
          last=$(git describe --tags --abbrev=0 --match 'v*')
          other=$(git log "$last"..HEAD --format=%s |
            grep -vE '^(fix\(deps\)|ci|chore|docs|test|build|style|refactor)(\([^)]*\))?: ' || true)
          if [ -n "$other" ]; then
            printf 'Waiting for review; changes besides dependency fixes:\n%s\n' "$other"
            exit 0
          fi
          gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
